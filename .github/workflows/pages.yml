name: pages
on:
  workflow_call:
    inputs:
      artifact:
        type: string
        required: true
      version:
        type: string
        required: true
      fixed:
        type: boolean
        default: false
      expected_archive:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: documentation-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: artifacts/docs/site
      - name: Archive exact payload and assemble candidate site
        id: tree
        env:
          DOC_VERSION: ${{ inputs.version }}
          DOC_FIXED: ${{ inputs.fixed }}
          DOC_BASE: ${{ inputs.expected_archive }}
        run: |
          args=(stage --version "$DOC_VERSION")
          if [ "$DOC_FIXED" = true ]; then
            if [ -z "$DOC_BASE" ]; then args+=(--initial); DOC_BASE=$(python -c "import sys; sys.path.insert(0,'scripts'); from docs_archive import archive_head; print(archive_head())"); fi
            args+=(--fixed)
          fi
          if [ -n "$DOC_BASE" ]; then args+=(--expected-archive "$DOC_BASE"); fi
          python scripts/docs_archive.py "${args[@]}"
      - name: Refuse stale main immediately before deployment
        if: ${{ !inputs.fixed }}
        run: python scripts/docs_archive.py assert-main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.tree.outputs.export }}
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live documentation
        env:
          DOC_VERSION: ${{ inputs.version }}
          DOC_FIXED: ${{ inputs.fixed }}
          DOC_COMMIT: ${{ steps.tree.outputs.docs_commit }}
          DOC_LATEST: ${{ steps.tree.outputs.latest }}
          DOC_CONTENT: ${{ steps.tree.outputs.content_sha256 }}
        run: |
          args=(online --version "$DOC_VERSION" --docs-commit "$DOC_COMMIT" --expected-latest "$DOC_LATEST" --expected-content "$DOC_CONTENT")
          if [ "$DOC_FIXED" = true ]; then args+=(--fixed); fi
          python scripts/docs_archive.py "${args[@]}"
      - name: Record successful deployment
        env:
          DOC_ARCHIVE: ${{ steps.tree.outputs.archive }}
          DOC_CANDIDATE: ${{ steps.tree.outputs.candidate }}
        run: python scripts/docs_archive.py complete --archive "$DOC_ARCHIVE" --candidate "$DOC_CANDIDATE" --run-id "$GITHUB_RUN_ID"
