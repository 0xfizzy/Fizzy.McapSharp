name: build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./scripts/Build.ps1 -Test -Pack
        shell: pwsh
      - run: python -m pip install mcap==1.3.1 lz4==4.4.5 zstandard==0.25.0
      - run: dotnet run --project tests/Interop -c Release -- write artifacts/interop
      - run: python tests/interop.py artifacts/interop
      - run: dotnet run --project tests/Interop -c Release -- read artifacts/interop
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg
