name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deep:
        description: Run native mutation, Valgrind, lifecycle and large-file checks
        type: boolean
        default: false
      seed:
        description: First deep-test seed
        type: number
        default: 1
      budget:
        description: Native mutation budget in seconds (1..1800)
        type: number
        default: 1200
  schedule:
    - cron: '0 2 * * 0'
permissions:
  contents: read
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      deep: ${{ github.event_name == 'schedule' || inputs.deep == true }}
      seed: ${{ fromJSON(github.event_name == 'schedule' && github.run_number || github.event_name == 'workflow_dispatch' && toJSON(inputs.seed) || '1') }}
      budget: ${{ fromJSON(github.event_name == 'workflow_dispatch' && toJSON(inputs.budget) || '1200') }}
