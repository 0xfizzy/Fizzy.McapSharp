name: validate
on:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - rid: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - rid: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'native/Cargo.lock') }}-${{ hashFiles('native/src/**', 'native/Cargo.toml') }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'native/Cargo.lock') }}-
      - run: python scripts/build.py build --test
      - run: python -m pip install mcap==1.3.1 lz4==4.4.5 zstandard==0.25.0
      - run: dotnet run --project tests/Interop -c Release -- write artifacts/interop
      - run: python tests/interop.py artifacts/interop
      - run: dotnet run --project tests/Interop -c Release -- read artifacts/interop
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: fixtures-${{ matrix.rid }}
          path: artifacts/interop/*.mcap
          retention-days: 1
          if-no-files-found: error
  pack:
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: artifacts/native/win-x64
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: artifacts/native/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64
          path: artifacts/native/linux-arm64
      - run: python scripts/build.py pack
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-package
          path: artifacts/packages/*.nupkg
          retention-days: 1
          if-no-files-found: error
  package-test:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            rid: win-x64
          - runner: ubuntu-22.04
            rid: linux-x64
          - runner: ubuntu-22.04-arm
            rid: linux-arm64
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: candidate-package
          path: artifacts/packages
      - run: python scripts/test_package.py
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}
      - uses: actions/download-artifact@v4
        with:
          pattern: fixtures-*
          path: artifacts/exchanged
      - run: dotnet run --project tests/Interop -c Release -- read-all artifacts/exchanged
  verified:
    needs: package-test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: candidate-package
          path: packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/*.nupkg
          retention-days: 7
          if-no-files-found: error
