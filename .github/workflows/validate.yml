name: validate
on:
  workflow_call:
    inputs:
      deep:
        type: boolean
        default: false
      seed:
        type: number
        default: 1
      budget:
        type: number
        default: 1200
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - rid: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - rid: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: artifacts/conformance
          key: conformance-${{ hashFiles('tests/conformance-lock.json') }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'native/Cargo.lock') }}-${{ hashFiles('native/src/**', 'native/Cargo.toml') }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'native/Cargo.lock') }}-
      - run: python scripts/build.py build --test
      - run: python -m pip install mcap==1.3.1 lz4==4.4.5 zstandard==0.25.0
      - run: dotnet run --project tests/Interop -c Release -- write artifacts/interop
      - run: python tests/interop.py artifacts/interop
      - run: dotnet run --project tests/Interop -c Release -- read artifacts/interop
      - run: python scripts/test_suites.py conformance --output artifacts/reports/conformance
      - run: python scripts/test_abi.py
      - run: python scripts/test_suites.py differential --no-build --samples 32 --output artifacts/reports/differential
      - run: python scripts/test_suites.py robustness --no-build --samples 32 --output artifacts/reports/robustness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.rid }}
          path: |
            artifacts/reports/**/*.json
            artifacts/reports/**/*.trx
            artifacts/reports/**/*.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failures-${{ matrix.rid }}
          path: artifacts/reports/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: fixtures-${{ matrix.rid }}
          path: artifacts/interop/*.mcap
          retention-days: 1
          if-no-files-found: error
  pack:
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: artifacts/native/win-x64
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: artifacts/native/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64
          path: artifacts/native/linux-arm64
      - run: python scripts/build.py pack
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-package
          path: artifacts/packages/*.nupkg
          retention-days: 1
          if-no-files-found: error
  package-test:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            rid: win-x64
          - runner: ubuntu-22.04
            rid: linux-x64
          - runner: ubuntu-22.04-arm
            rid: linux-arm64
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: candidate-package
          path: artifacts/packages
      - uses: actions/download-artifact@v4
        with:
          pattern: fixtures-*
          path: artifacts/exchanged
      - run: python scripts/test_package.py --fixtures artifacts/exchanged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-report-${{ matrix.runner }}
          path: artifacts/package-report.json
          retention-days: 7
  deep:
    if: inputs.deep
    needs: native
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: artifacts/native/linux-x64
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Deep native and managed contracts
        env:
          TEST_SEED: ${{ inputs.seed }}
          TEST_BUDGET: ${{ inputs.budget }}
        run: python scripts/test_deep.py --seed "$TEST_SEED" --budget "$TEST_BUDGET" --output artifacts/deep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-report
          path: |
            artifacts/deep/*.json
            artifacts/deep/*.log
            artifacts/deep/upstream-*.mcap
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deep-failure
          path: |
            artifacts/deep/*.mcap
            artifacts/deep/*.json
            artifacts/deep/*.log
          retention-days: 14
  verified:
    if: always()
    needs: [native, pack, package-test, deep]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every enabled gate
        env:
          NATIVE: ${{ needs.native.result }}
          PACK: ${{ needs.pack.result }}
          PACKAGE: ${{ needs.package-test.result }}
          DEEP: ${{ needs.deep.result }}
          DEEP_ENABLED: ${{ inputs.deep }}
        run: |
          test "$NATIVE" = success
          test "$PACK" = success
          test "$PACKAGE" = success
          if [ "$DEEP_ENABLED" = true ]; then test "$DEEP" = success; else test "$DEEP" = skipped; fi
      - uses: actions/download-artifact@v4
        with:
          name: candidate-package
          path: packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/*.nupkg
          retention-days: 7
          if-no-files-found: error
