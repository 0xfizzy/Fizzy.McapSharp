[package]
name = "fizzy_mcap_native"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib"]
[dependencies]
mcap = "=0.25.0"
serde_json = "=1.0.149"
memmap2 = "=0.9.9"
crc32fast = "=1.5.0"
enumset = "=1.1.14"
binrw = "=0.15.2"

[dev-dependencies]
mcap = { version = "=0.25.0", features = ["allocation-audit"] }

[patch.crates-io]
mcap = { path = "vendor/mcap" }
zstd-sys = { path = "vendor/zstd-sys" }
